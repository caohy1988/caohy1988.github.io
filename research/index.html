<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Field Brief: a daily ranked watch on agent analytics. Public sources only.">
  <meta property="og:title" content="The Field Brief — Haiyuan Cao">
  <meta property="og:description" content="Daily ranked research on agent analytics. The brief directs attention; the source remains the authority.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://caohy1988.github.io/research/">
  <meta name="theme-color" content="#101828">
  <title>The Field Brief — Haiyuan Cao</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #101828;
      --navy-2: #17233a;
      --paper: #f4efe6;
      --paper-2: #ebe4d8;
      --cream: #fbf7f0;
      --ink: #161410;
      --ink-soft: #5c564c;
      --ink-faint: #8a8378;
      --line: #d9d0c3;
      --accent: #e87324;
      --accent-dark: #b7480d;
      --mint: #0f766e;
      --rule: 1px solid var(--line);
      --serif: "Fraunces", Iowan Old Style, Charter, Georgia, serif;
      --sans: "IBM Plex Sans", Inter, ui-sans-serif, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 17px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    button, input { font: inherit; }
    code {
      font-family: var(--mono);
      font-size: 0.86em;
      background: var(--paper-2);
      padding: 0.08em 0.32em;
      border-radius: 4px;
    }
    .shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }

    .topbar { background: var(--navy); color: #e8edf4; }
    .topbar-inner {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .brand {
      text-decoration: none;
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.16em;
    }
    .brand span { color: var(--accent); }
    .nav-links { display: flex; gap: 22px; }
    .nav-links a {
      color: #b7c2d0;
      font-size: 0.86rem;
      font-weight: 600;
      text-decoration: none;
    }
    .nav-links a:hover, .nav-links a[aria-current="page"] { color: #fff; }

    .masthead {
      padding: 36px 0 28px;
      border-bottom: 3px solid var(--ink);
      background: var(--cream);
    }
    .masthead-kicker {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 10px;
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent-dark);
    }
    .nameplate {
      margin: 0;
      font-family: var(--serif);
      font-optical-sizing: auto;
      font-size: clamp(3.2rem, 9vw, 6.4rem);
      font-weight: 600;
      letter-spacing: -0.045em;
      line-height: 0.86;
      text-align: center;
    }
    .nameplate em { font-style: italic; font-weight: 500; }
    .masthead-rule {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid var(--ink);
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .edition-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px 24px;
      padding: 22px 0 8px;
    }
    .edition-date {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .edition-meta { color: var(--ink-soft); font-size: 0.92rem; }
    .live {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-left: 10px;
      color: var(--mint);
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .live::before {
      content: "";
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 0 4px rgba(15,118,110,.16);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 10px;
      padding: 4px 0 18px;
      border-bottom: var(--rule);
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
    .chip {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--cream);
      color: var(--ink-soft);
      padding: 6px 11px;
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .chip:hover { border-color: var(--ink); color: var(--ink); }
    .chip[aria-pressed="true"] {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
    }
    .search {
      appearance: none;
      width: min(260px, 100%);
      border: 1px solid var(--line);
      background: var(--cream);
      padding: 8px 12px;
      border-radius: 999px;
      color: var(--ink);
    }
    .search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .search::placeholder { color: var(--ink-faint); }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(280px, 0.7fr);
      gap: 36px 48px;
      padding: 18px 0 64px;
      align-items: start;
    }

    .lead { padding: 8px 0 28px; border-bottom: var(--rule); }
    .lead .num {
      font-family: var(--serif);
      font-size: 4.4rem;
      font-weight: 600;
      line-height: 0.8;
      color: var(--accent);
      letter-spacing: -0.06em;
    }
    .tag {
      display: inline-block;
      margin: 0 0 8px;
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-dark);
    }
    .lead h2 {
      margin: 6px 0 14px;
      font-family: var(--serif);
      font-optical-sizing: auto;
      font-size: clamp(2rem, 4.4vw, 3.15rem);
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1.08;
      text-wrap: balance;
    }
    .lead p, .card p, .note p { margin: 0; color: var(--ink-soft); }
    .lead a, .card a, .note a, .open-item a {
      color: var(--accent-dark);
      font-weight: 650;
      text-decoration: none;
      box-shadow: inset 0 -1px 0 rgba(183,72,13,.35);
    }
    .lead a:hover, .card a:hover, .note a:hover { box-shadow: inset 0 -2px 0 var(--accent); }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      margin-top: 6px;
    }
    .card { padding: 22px 22px 22px 0; border-bottom: var(--rule); }
    .card:nth-child(odd) { padding-right: 22px; border-right: var(--rule); }
    .card:nth-child(even) { padding-left: 22px; }
    .card .num {
      font-family: var(--serif);
      font-size: 1.65rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: -0.04em;
    }
    .card h3 {
      margin: 4px 0 10px;
      font-family: var(--serif);
      font-size: 1.28rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    .rail h2 {
      margin: 0 0 14px;
      font-family: var(--serif);
      font-size: 1.35rem;
      letter-spacing: -0.03em;
    }
    .rail-kicker {
      margin: 0 0 6px;
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-dark);
    }
    .note { padding: 14px 0; border-top: var(--rule); }
    .note b { display: block; margin-bottom: 4px; font-size: 0.98rem; }
    .open-item {
      display: grid;
      grid-template-columns: 10px 1fr;
      gap: 10px;
      padding: 12px 0;
      border-top: var(--rule);
    }
    .open-item i {
      width: 8px; height: 8px;
      margin-top: 8px;
      border-radius: 50%;
      background: var(--accent);
    }
    .open-item b { display: block; font-size: 0.95rem; }
    .open-item p { margin: 4px 0 0; color: var(--ink-soft); font-size: 0.92rem; }

    .cal {
      margin: 0 0 28px;
      padding-bottom: 8px;
      border-bottom: 3px solid var(--ink);
    }
    .cal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .cal-head h2 {
      margin: 0;
      font-size: 1.2rem;
    }
    .cal-nav {
      appearance: none;
      width: 32px; height: 32px;
      border: 1px solid var(--line);
      background: var(--cream);
      border-radius: 8px;
      cursor: pointer;
      color: var(--ink);
    }
    .cal-nav:hover { border-color: var(--ink); }
    .cal-week, .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
    }
    .cal-week span {
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-faint);
      padding: 4px 0 8px;
    }
    .cal-cell {
      appearance: none;
      background: none;
      border: 0;
      height: 38px;
      border-radius: 10px;
      cursor: default;
      color: var(--ink-faint);
      font-family: var(--mono);
      font-size: 0.78rem;
      position: relative;
    }
    .cal-cell.has {
      color: var(--ink);
      cursor: pointer;
      font-weight: 600;
    }
    .cal-cell.has::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 5px;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--accent);
      transform: translateX(-50%);
    }
    .cal-cell.has:hover { background: var(--paper-2); }
    .cal-cell[aria-current="date"] {
      background: var(--navy);
      color: #fff;
    }
    .cal-cell[aria-current="date"]::after { background: var(--accent); }
    .cal-cell.muted { opacity: 0.35; }

    .archive { margin-top: 8px; }
    .days { display: flex; flex-direction: column; }
    .day {
      appearance: none;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      border-bottom: var(--rule);
      padding: 12px 0;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--ink-soft);
    }
    .day:hover, .day[aria-current="true"] { color: var(--ink); }
    .day[aria-current="true"] { font-weight: 650; }
    .day .d-date { font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.04em; }
    .day .d-no { font-family: var(--mono); font-size: 0.72rem; color: var(--ink-faint); }

    footer {
      border-top: 3px solid var(--ink);
      padding: 22px 0 36px;
      color: var(--ink-soft);
      font-size: 0.9rem;
      background: var(--cream);
    }
    .footer-inner { display: flex; justify-content: space-between; gap: 16px; }
    .footer-inner .mono {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
    }
    .empty { padding: 48px 0; color: var(--ink-soft); }
    .hide { display: none; }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
      .card:nth-child(odd), .card:nth-child(even) { padding: 20px 0; border-right: 0; }
      .masthead-kicker, .masthead-rule, .footer-inner { flex-direction: column; gap: 6px; }
      .nameplate { font-size: clamp(2.6rem, 16vw, 4rem); text-align: left; }
      .search { width: 100%; }
    }
    @media (max-width: 640px) {
      .nav-links a:not(:last-child) { display: none; }
    }
    @media print {
      .topbar, .controls, .cal, .archive, footer { display: none; }
      body { background: #fff; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="/"><span>HC</span> / FIELD NOTES</a>
      <nav class="nav-links" aria-label="Primary">
        <a href="/">Talk</a>
        <a href="/research/" aria-current="page">Research</a>
      </nav>
    </div>
  </div>

  <header class="masthead">
    <div class="shell">
      <p class="masthead-kicker"><span>Daily ranked watch</span><span>Public sources only</span></p>
      <h1 class="nameplate">The Field <em>Brief.</em></h1>
      <p class="masthead-rule">
        <span>Agent analytics</span>
        <span>Industry · academy · own stack</span>
        <span>Verify the source</span>
      </p>
    </div>
  </header>

  <main class="shell">
    <div class="edition-bar">
      <h2 class="edition-date" id="edition-date">Loading edition…</h2>
      <p class="edition-meta" id="edition-meta"></p>
    </div>
    <div class="controls" id="controls" hidden></div>
    <div class="layout" id="app">
      <p class="empty">Fetching today’s brief…</p>
    </div>
  </main>

  <footer>
    <div class="shell footer-inner">
      <p>© Haiyuan Cao · Personal views. No confidential employer material.</p>
      <p class="mono">WATCH · RANK · LINK · VERIFY</p>
    </div>
  </footer>

  <script>
    const $ = (id) => document.getElementById(id);
    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const STATE = { editions: [], calY: null, calM: null };

    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }
    function strip(html) { return String(html || "").replace(/<[^>]+>/g, " "); }
    function blob(item) { return ((item.title || "") + " " + strip(item.html)).toLowerCase(); }
    function sorted() {
      return STATE.editions.slice().sort((a, b) => b.date.localeCompare(a.date));
    }
    function params() {
      const q = new URLSearchParams(location.search);
      return {
        date: (location.hash || "").replace(/^#/, "") || q.get("date") || "",
        tag: q.get("tag") || "All",
        q: (q.get("q") || "").trim()
      };
    }
    function setParams({ date, tag, q }, pushHash) {
      const sp = new URLSearchParams();
      if (tag && tag !== "All") sp.set("tag", tag);
      if (q) sp.set("q", q);
      const search = sp.toString();
      const hash = date ? "#" + date : location.hash;
      const url = location.pathname + (search ? "?" + search : "") + hash;
      history.replaceState(null, "", url);
      if (pushHash && date) location.hash = date;
    }

    function allTags(list) {
      const set = new Set();
      list.forEach(e => (e.ranks || []).forEach(r => r.tag && set.add(r.tag)));
      return ["All", ...Array.from(set), "Desk", "Open"];
    }

    function itemMatch(item, tag, q, kind) {
      if (q && !blob(item).includes(q.toLowerCase())) return false;
      if (!tag || tag === "All") return true;
      if (tag === "Desk") return kind === "desk";
      if (tag === "Open") return kind === "open";
      return (item.tag || "") === tag && kind === "rank";
    }

    function editionHasMatch(ed, tag, q) {
      if ((!tag || tag === "All") && !q) return true;
      const ranks = (ed.ranks || []).some(r => itemMatch(r, tag, q, "rank"));
      const desk = (ed.desk || []).some(r => itemMatch(r, tag, q, "desk"));
      const open = (ed.open || []).some(r => itemMatch(r, tag, q, "open"));
      return ranks || desk || open;
    }

    function calHtml(currentId, byDate, tag, q) {
      const y = STATE.calY, m = STATE.calM;
      const first = new Date(y, m, 1);
      const start = first.getDay();
      const daysIn = new Date(y, m + 1, 0).getDate();
      const prevDays = new Date(y, m, 0).getDate();
      const cells = [];
      for (let i = 0; i < start; i++) {
        cells.push(`<span class="cal-cell muted">${prevDays - start + 1 + i}</span>`);
      }
      for (let d = 1; d <= daysIn; d++) {
        const id = y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
        const ed = byDate.get(id);
        const has = !!ed;
        const match = has && editionHasMatch(ed, tag, q);
        const cur = id === currentId ? ' aria-current="date"' : "";
        const cls = ["cal-cell", has ? "has" : "", has && !match ? "muted" : ""].filter(Boolean).join(" ");
        cells.push(`<button class="${cls}" type="button" data-id="${id}" ${has ? "" : "disabled"}${cur}>${d}</button>`);
      }
      return `
        <div class="cal" aria-label="Edition calendar">
          <p class="rail-kicker">Calendar</p>
          <div class="cal-head">
            <button class="cal-nav" type="button" data-cal="-1" aria-label="Previous month">‹</button>
            <h2>${MONTHS[m]} ${y}</h2>
            <button class="cal-nav" type="button" data-cal="1" aria-label="Next month">›</button>
          </div>
          <div class="cal-week">${["Su","Mo","Tu","We","Th","Fr","Sa"].map(d => `<span>${d}</span>`).join("")}</div>
          <div class="cal-grid">${cells.join("")}</div>
        </div>`;
    }

    function render() {
      const list = sorted();
      const { date, tag, q } = params();
      const current = list.find(e => e.id === date) || list[0];
      if (!current) {
        $("app").innerHTML = '<p class="empty">No editions yet.</p>';
        return;
      }
      if (STATE.calY == null) {
        const [yy, mm] = current.date.split("-").map(Number);
        STATE.calY = yy; STATE.calM = mm - 1;
      }
      const isLatest = current.id === list[0].id;
      $("edition-date").innerHTML = current.weekday + ", " + escapeHtml(current.displayDate) +
        (isLatest ? '<span class="live">Latest</span>' : "");
      $("edition-meta").textContent =
        "No. " + String(current.edition).padStart(3, "0") +
        "  ·  " + current.ranks.length + " ranked  ·  " + current.kicker;

      const tags = allTags(list);
      $("controls").hidden = false;
      $("controls").innerHTML =
        `<div class="chips">` + tags.map(t =>
          `<button class="chip" type="button" data-tag="${escapeHtml(t)}" aria-pressed="${t === tag}">${escapeHtml(t)}</button>`
        ).join("") + `</div>
        <input class="search" type="search" placeholder="Filter this brief…" value="${escapeHtml(q)}" aria-label="Filter stories">`;

      const ranks = (current.ranks || []).filter(r => itemMatch(r, tag, q, "rank"));
      const deskItems = (current.desk || []).filter(r => itemMatch(r, tag, q, "desk"));
      const openItems = (current.open || []).filter(r => itemMatch(r, tag, q, "open"));
      const lead = ranks[0];
      const rest = ranks.slice(1);
      const byDate = new Map(list.map(e => [e.id, e]));

      const desk = deskItems.map(n => `<div class="note"><b>${escapeHtml(n.title)}</b><p>${n.html}</p></div>`).join("");
      const open = openItems.map(n => `<div class="open-item"><i></i><div><b>${escapeHtml(n.title)}</b><p>${n.html}</p></div></div>`).join("");
      const days = list.map(e =>
        `<button class="day" type="button" data-id="${escapeHtml(e.id)}" aria-current="${e.id === current.id}">
          <span class="d-date">${escapeHtml(e.displayDate)}</span>
          <span class="d-no">No. ${String(e.edition).padStart(3,"0")}</span>
        </button>`
      ).join("");

      const main = !lead && !desk && !open
        ? `<p class="empty">Nothing in this edition matches that filter.</p>`
        : `
          ${lead ? `<article class="lead">
            <div class="num">${lead.n}</div>
            <p class="tag">${escapeHtml(lead.tag)}</p>
            <h2>${escapeHtml(lead.title)}</h2>
            <p>${lead.html}</p>
          </article>` : ""}
          <div class="grid">
            ${rest.map(r => `
              <article class="card">
                <div class="num">${r.n}</div>
                <p class="tag">${escapeHtml(r.tag)}</p>
                <h3>${escapeHtml(r.title)}</h3>
                <p>${r.html}</p>
              </article>`).join("")}
          </div>`;

      $("app").innerHTML = `
        <div>${main}</div>
        <aside class="rail">
          ${calHtml(current.id, byDate, tag, q)}
          <div class="${desk ? "" : "hide"}">
            <p class="rail-kicker">On the desk</p>
            <h2>Own stack tonight</h2>
            ${desk}
          </div>
          <div class="${open ? "" : "hide"}" style="margin-top:28px">
            <p class="rail-kicker">Still open</p>
            <h2>Broken or lagging</h2>
            ${open}
          </div>
          <div class="archive">
            <p class="rail-kicker">Archive</p>
            <h2>Past briefs</h2>
            <div class="days">${days}</div>
          </div>
        </aside>`;

      bind(current.id);
      document.title = current.displayDate + " · The Field Brief";
    }

    function bind(currentId) {
      $("app").querySelectorAll(".day, .cal-cell.has").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.id;
          if (!id) return;
          const [yy, mm] = id.split("-").map(Number);
          STATE.calY = yy; STATE.calM = mm - 1;
          const { tag, q } = params();
          setParams({ date: id, tag, q });
          location.hash = id;
        });
      });
      $("app").querySelectorAll("[data-cal]").forEach(btn => {
        btn.addEventListener("click", () => {
          const delta = Number(btn.dataset.cal);
          STATE.calM += delta;
          if (STATE.calM < 0) { STATE.calM = 11; STATE.calY -= 1; }
          if (STATE.calM > 11) { STATE.calM = 0; STATE.calY += 1; }
          render();
        });
      });
      $("controls").querySelectorAll("[data-tag]").forEach(btn => {
        btn.addEventListener("click", () => {
          const { date, q } = params();
          setParams({ date: date || currentId, tag: btn.dataset.tag, q });
          render();
        });
      });
      const search = $("controls").querySelector(".search");
      if (search) {
        search.addEventListener("input", () => {
          const { date, tag } = params();
          setParams({ date: date || currentId, tag, q: search.value });
          render();
          const again = $("controls").querySelector(".search");
          if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
        });
      }
    }

    async function boot() {
      try {
        const res = await fetch("/research/editions.json", { cache: "no-store" });
        STATE.editions = (await res.json()).editions || [];
      } catch (err) {
        $("app").innerHTML = '<p class="empty">Could not load editions.json.</p>';
        return;
      }
      render();
      window.addEventListener("hashchange", render);
      window.addEventListener("keydown", (e) => {
        if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
        if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
        const list = sorted();
        const { date, tag, q } = params();
        const id = date || list[0].id;
        const i = list.findIndex(x => x.id === id);
        const next = e.key === "ArrowRight" ? list[i + 1] : list[i - 1];
        if (!next) return;
        const [yy, mm] = next.id.split("-").map(Number);
        STATE.calY = yy; STATE.calM = mm - 1;
        setParams({ date: next.id, tag, q });
        location.hash = next.id;
      });
    }
    boot();
  </script>
</body>
</html>

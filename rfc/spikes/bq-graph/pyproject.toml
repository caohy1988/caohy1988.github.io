[project]
name = "okf-bq-graph-spike"
version = "0.1.0"
description = "OKF acme_retail -> BigQuery Graph spike (2026-09-05). Experimental; not a serving-tier commitment."
requires-python = ">=3.10"
dependencies = ["google-cloud-bigquery==3.45.0", "google-auth>=2.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
